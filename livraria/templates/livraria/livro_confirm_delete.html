{% extends "livraria/base.html" %}
{% block title %}Excluir livro{% endblock %}
{% block content %}
<h2>Excluir livro</h2>
<p>Tem certeza que deseja excluir <strong>{{ object.titulo }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn perigo">Sim, excluir</button>
    <a href="{% url 'livraria:livro_list' %}">Cancelar</a>
</form>
{% endblock %}
